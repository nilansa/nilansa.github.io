<script id="dataset" type="application/json">[{"n":1,"title":"Ceous: Efficient Retrieval Adaptation from Limited Reranker Feedback","subtitle":"Nilanjan Sarkar · IIIT Hyderabad · Information Retrieval and Extraction","chapter":"Opening","notes":"We study how to adapt retrieval at inference time while keeping the embedding model and reranker frozen. The central question is whether a limited set of black-box reranker scores can be converted into a query representation that retrieves better from the full corpus. Our specific experiment changes which documents supply feedback to TTT-Embed: ordinary dense top-ranked documents versus a DISCo-inspired complementary selection policy.","source":"","bullets":["Project: Ceous","Course: M26CS4.406","17 November 2026"]},{"n":2,"title":"The deployment constraint","subtitle":"A useful reranker may be available even when model weights are not","chapter":"Motivation","notes":"In a deployed system, the retriever and reranker may be accessible only through interfaces. We can submit a query, retrieve candidates and observe scalar relevance scores, but we may not have permission to update model weights or inspect internal gradients. Full retraining can also require data, compute, deployment coordination and regression testing. The setting here is narrower: adapt one query at inference time using outputs the system already exposes.","source":"","bullets":["Frozen query/document encoders","Frozen black-box reranker","Accessible vectors, scalar scores and search API"]},{"n":3,"title":"A reranker cannot rescue a document it never sees","subtitle":"Candidate generation and relevance estimation are different operations","chapter":"Motivation","notes":"Dense retrieval compares a query vector with the stored document vectors and returns a candidate pool. A cross-encoder reranker can judge each supplied query-document pair more carefully, but it only reorders that supplied pool. If a relevant document is absent, reranking cannot introduce it. This motivates using reranker feedback to modify the query and then searching the full collection again.","source":"","bullets":["Retriever: searches the corpus","Reranker: scores supplied pairs","Adapted query: can trigger a new search"]},{"n":4,"title":"Relevance feedback has a long history","subtitle":"From moving a query toward useful evidence to adapting a neural query vector","chapter":"Lineage","notes":"The underlying intuition predates neural retrieval. Classical vector-space relevance feedback, associated with Rocchio, moves a query representation toward relevant documents and away from non-relevant ones. Pseudo-relevance feedback applies a similar idea when relevance labels are not explicitly supplied by a person. Modern systems replace manually supplied labels with a learned reranker, but the operational question remains: how should evidence change the query used for the next search?","source":"https://archive.org/details/smartretrievalsy0000salm","bullets":["Classical relevance feedback","Pseudo-relevance feedback","Inference-time query adaptation"]},{"n":5,"title":"Inference-time adaptation: use the evidence already available","subtitle":"The system changes its query state, not its model parameters","chapter":"Motivation","notes":"Inference-time adaptation is useful when a system needs to respond to a particular query without updating and redeploying the underlying model. In retrieval, the query is already a compact representation of the information need. If feedback tells us which candidates better satisfy that need, we can use it to refine the query representation and issue another search. This is a local, request-time operation; it is not a claim that retraining is never useful.","source":"","bullets":["No encoder fine-tuning in this project","No reranker fine-tuning","Per-query state can be discarded after use"]},{"n":6,"title":"TOuR: optimise a test-time query representation","subtitle":"Retrieve → obtain cross-encoder feedback → update the query → retrieve again","chapter":"Lineage","notes":"TOuR makes query adaptation explicit for dense retrieval. It uses cross-encoder feedback on retrieved passages to define an objective for changing the test query representation. The updated query is then used for retrieval again. The important conceptual move is that a frozen retrieval model can still produce a different ranking because the input representation used for search has changed.","source":"https://aclanthology.org/2023.findings-acl.354/","bullets":["TOuR: Test-time query optimisation for dense retrieval","Cross-encoder pseudo-feedback","Second retrieval with an updated query"]},{"n":7,"title":"TOuR-hard and TOuR-soft","subtitle":"A binary target and a graded preference distribution encode different feedback","chapter":"Lineage","notes":"The hard variant turns feedback into a more discrete positive-versus-negative signal. The soft variant retains graded teacher preferences rather than collapsing them to a single binary target. This distinction matters because a reranker often knows that one candidate is much better than another, while several candidates may all be partially useful. Keeping relative preference information can provide a richer training target for the query update.","source":"https://aclanthology.org/2023.findings-acl.354/","bullets":["Hard: discrete pseudo-labels","Soft: preserve graded teacher preferences","Both operate at inference time"]},{"n":8,"title":"ReFIT: reuse reranker scores during query optimisation","subtitle":"One scored candidate slate can support multiple inexpensive query updates","chapter":"Lineage","notes":"ReFIT develops reranker-guided relevance feedback at inference time. Its practical usefulness is that the expensive reranker scores for a selected candidate set can be reused while the query representation is optimised. The inner optimisation does not require a fresh reranker call at every step. This separates expensive teacher inference from cheaper vector optimisation and a subsequent retrieval operation.","source":"https://arxiv.org/abs/2305.11744","bullets":["Cached reranker feedback","Query representation optimisation","Second retrieval"]},{"n":9,"title":"What the lineage contributes","subtitle":"TOuR, ReFIT and TTT-Embed solve related but non-identical formulations","chapter":"Lineage","notes":"These methods should not be treated as interchangeable names. TOuR established test-time query optimisation with hard and soft feedback variants. ReFIT distils reranker relevance information into a query representation while reusing teacher scores. TTT-Embed formulates an additive residual in the embedding output space and studies how that residual can be shared across queries or tasks. Our main experiments use the TTT-Embed query-wise objective.","source":"","bullets":["TOuR: feedback-driven query optimisation","ReFIT: cached relevance feedback","TTT-Embed: additive output-space residual"]},{"n":10,"title":"TTT-Embed: represent adaptation as an external residual","subtitle":"The learned object is a vector v, not a new encoder checkpoint","chapter":"TTT-Embed","notes":"Let x be the frozen query embedding and z_d a frozen document embedding. TTT-Embed introduces an external vector v and forms a corrected query from x and v. The vector is fitted so that the retriever's distribution over feedback documents approaches the reranker's preference distribution. This gives a compact adaptation state in the same output space used by the retriever. The encoder and stored document vectors remain unchanged.","source":"https://arxiv.org/abs/2608.12569","bullets":["Original query: x","External residual: v","Corrected query: unit(x + αv)"]},{"n":11,"title":"What does the residual change geometrically?","subtitle":"It changes the query-to-document scores for every stored document","chapter":"TTT-Embed","notes":"The residual is a direction in the retriever's embedding space. Once added to the query and normalised, it changes the cosine similarity between that query and every stored document vector. A document does not need to have received reranker feedback to benefit from the changed ranking. The denominator from normalisation is common to all documents for one query, so the ranking is governed by the original score plus the residual's projection onto each document vector.","source":"","bullets":["x′ᵀz_d = (xᵀz_d + αvᵀz_d) / ||x+αv||","Residual contribution: vᵀz_d","Full-corpus re-search is essential"],"image":"assets/query-residual-geometry.png","image_caption":"External residual geometry · schematic"},{"n":12,"title":"Why turn scores into a distribution?","subtitle":"Raw scores can have different scales; relative preferences are the target","chapter":"TTT-Embed","notes":"The reranker may return scalar scores whose absolute range is not directly comparable with the retriever's cosine similarities. TTT-Embed converts the selected teacher scores into a probability distribution with softmax and a temperature. The temperature controls concentration: a smaller value puts more mass on the highest-scoring items, while a larger value spreads probability more evenly. The student uses its own temperature because its score scale and desired sharpness are separate modelling choices.","source":"","bullets":["p_T = softmax(r / τ_T)","p_S(v) = softmax(sim(unit(x+v), z) / τ_S)","Project setting: τ_T = 0.02, τ_S = 0.05"],"image":"assets/temperature-schematic.png","image_caption":"Softmax temperature · illustrative score vector"},{"n":13,"title":"KL divergence turns preferences into a fitting objective","subtitle":"Move the student distribution toward the fixed teacher distribution","chapter":"TTT-Embed","notes":"The teacher distribution is fixed after reranker scoring. The student distribution changes as v changes. Forward KL divergence, DKL(p_T || p_S), penalises the student when it assigns too little probability to items the teacher prefers. A ridge term discourages unnecessarily large residuals. We optimise only v, using Adam. The curve shown here is a mathematical illustration of the objective, not a logged loss trace from the experiment.","source":"","bullets":["L(v) = DKL(p_T || p_S(v)) + λ||v||²","λ = 0.3","300 Adam steps; learning rate 0.01"],"image":"assets/kl-schematic.png","image_caption":"KL objective · mathematical illustration, not logged trace"},{"n":14,"title":"Query-wise, task-wise and global adaptation","subtitle":"The sharing scope determines which feedback examples shape one residual","chapter":"TTT-Embed","notes":"TTT-Embed studies different scopes for sharing the residual. Query-wise adaptation fits one vector from one query's feedback. Task-wise adaptation shares a vector across rewarded queries in a task. Global adaptation shares across tasks. Sharing can pool more feedback, but it also assumes that different queries or tasks benefit from a common direction. Our DISCo-feedback FiQA and H8 experiments use query-wise fitting; the separate task-wise FiQA cross-fit is a different experiment.","source":"https://arxiv.org/abs/2608.12569","bullets":["Query-wise: one query → one v","Task-wise: one task → shared v","Global: multiple tasks → shared v"]},{"n":15,"title":"Complementary retrieval: retrieve evidence with different strengths","subtitle":"Diversity, aspect coverage and lexical-semantic complementarity are established ideas","chapter":"Complementarity","notes":"A query may ask about several entities, relations or constraints. Dense retrieval can return several passages that are individually similar but repeat the same aspect. Complementary retrieval tries to obtain evidence with different strengths: lexical retrieval can recover exact terms, diversification can reduce redundancy, and aspect-coverage methods can represent multiple facets. Examples include MMR, xQuAD or IA-Select, hybrid BM25-plus-dense retrieval, and collective token coverage.","source":"","bullets":["MMR: relevance with redundancy penalty","BM25 + dense / rank fusion: lexical-semantic complementarity","Aspect coverage: represent multiple query facets"]},{"n":16,"title":"ColBERT and DISCo are related, but not the same","subtitle":"Individual token relevance differs from set-level collective coverage","chapter":"Complementarity","notes":"ColBERT-style late interaction scores a document by matching each query token to its best document-token match. That score is computed per document. DISCo instead selects a set whose union collectively covers the query-token representations. Once an aspect is already covered by the selected set, another document repeating it contributes less marginal coverage. This is why DISCo is relevant to feedback-set construction, but it does not automatically guarantee relevance.","source":"https://openreview.net/forum?id=cUdODCFjUM","bullets":["ColBERT: per-document MaxSim","DISCo: set-level collective coverage","Coverage ≠ relevance guarantee"]},{"n":17,"title":"DISCo: select a set for collective query-token coverage","subtitle":"Greedy selection rewards the marginal evidence added by each new document","chapter":"Complementarity","notes":"DISCo represents query and document content with contextual token vectors. For each query token, the set receives credit for its best matching token across all selected documents. A greedy algorithm adds the candidate with the largest marginal increase in this objective. In a multi-hop question, one passage may cover the first entity or relation while another supplies the second piece of evidence. The selected set is judged collectively rather than one document at a time.","source":"https://openreview.net/forum?id=cUdODCFjUM","bullets":["F(S,Q) = Σ_j max_{t ∈ union_{d∈S} X_d} u_jᵀt","Greedy marginal coverage","Example is schematic, not a FiQA query"],"image":"assets/coverage-schematic.png","image_caption":"Collective coverage · schematic"},{"n":18,"title":"Why complementary feedback can change the residual","subtitle":"Selection changes which document vectors and teacher preferences enter the residual gradient","chapter":"Hypothesis","notes":"The TTT-Embed gradient depends on the difference between student and teacher probabilities, weighted by the selected Qwen document vectors and projected through query normalisation. If the selected set contains repeated evidence, those vectors may provide a narrow or redundant set of directions. A complementary set may expose additional directions. But coverage is calculated using BERT token representations, while the residual is fitted in Qwen's embedding space. The hypothesis therefore requires alignment: a newly covered aspect must also be relevant and informative in the Qwen space. This is a mechanism to test, not a guarantee.","source":"","bullets":["∇_v L ∝ (I−uuᵀ) Σ_i (p_i^S−p_i^T) z_i + 2λv","BERT coverage chooses IDs; Qwen vectors determine v","Complementarity may help only when new evidence is relevant and geometrically useful"]},{"n":19,"title":"Two different meanings of DISCo + TTT-Embed","subtitle":"The completed experiment is fixed-pool selection; a new first-stage retriever remains a future test","chapter":"Implementation boundary","notes":"Our completed FiQA and H8 implementation first retrieves a dense top-fifty pool with Qwen. BERT contextual-token coverage selects ten documents inside that pool. The Qwen reranker scores those ten, and query-wise TTT-Embed fits the residual. This tests the feedback-selection principle. It does not replace the initial Qwen retriever with the original DISCo corpus index. A true complementary first-stage retriever that discovers candidates outside the dense pool is a distinct experiment and has not been run here.","source":"","bullets":["Executed: Qwen top-50 → BERT coverage top-10 → Qwen reranker → TTT-Embed → full search","Not executed: original DISCo index replacing Qwen candidate generation","Do not call the completed run an exact DISCo reproduction"]},{"n":20,"title":"FiQA-200: controlled feedback-selection experiment","subtitle":"Same 57,638-document corpus, same 200 queries, ten teacher pairs per arm","chapter":"FiQA","notes":"The FiQA experiment uses the full 57,638-document collection and 200 predetermined queries. Qwen3-Embedding-0.6B supplies a common dense top-fifty pool. Each selector chooses ten documents; Qwen3-Reranker-4B provides the teacher scores; query-wise TTT-Embed fits an independent residual with 300 Adam steps. The corrected query searches the complete corpus again. The primary metric is nDCG@10 against FiQA relevance judgements. The query set had prior project exposure, so this is an exploratory paired comparison.","source":"","bullets":["57,638 documents · 200 queries","Top-50 candidate pool · 10 feedback pairs","Qwen3-Embedding-0.6B · Qwen3-Reranker-4B · BERT-base-uncased"]},{"n":21,"title":"FiQA-200: recorded full-corpus retrieval results","subtitle":"The table separates the principal baseline from alternative feedback policies","chapter":"FiQA","notes":"Standard dense-feedback TTT records nDCG@10 of 0.505956. DISCo-style coverage TTT records 0.480703. Other recorded arms include MMR, hybrid retrieval, BERT MaxSim and BM25 feedback. The paired coverage-minus-dense TTT difference is minus 0.025253, with a descriptive paired interval from minus 0.043324 to minus 0.007492. Coverage minus rank-matched TTT is plus 0.004556, with an interval spanning zero. These are the archived experiment values; no new run is implied.","source":"","bullets":["Primary baseline: dense top-10 + TTT = 0.505956","Coverage + TTT = 0.480703","Paired intervals and all other arms shown in the chart"],"image":"assets/fiqa-results.png","image_caption":"FiQA-200 recorded nDCG@10"},{"n":22,"title":"Query-level examples: promotions and regressions","subtitle":"Averages hide document-level movements; inspect both wins and losses","chapter":"FiQA","notes":"The casebook contains query-level rank transitions. For the education-loan query, a judged document moves from raw rank 27 to dense-TTT rank 10 and coverage-TTT rank 1; the coverage reranker score was 0.987568. For the LLC query, a judged document already at raw rank 1 remains rank 1 under dense TTT but moves to rank 3 under coverage TTT. These cases illustrate both a promotion and a regression. They do not by themselves establish why the selector chose the document; the saved archive does not include every token-level marginal coverage contribution.","source":"","bullets":["Education loan: 27 → 10 → 1","LLC query: 1 → 1 → 3","Selected examples must be read alongside all 200 cases"],"image":"assets/fiqa-paired-ci.png","image_caption":"FiQA paired differences · exploratory intervals"},{"n":23,"title":"HotpotQA-HardNegatives: a second DISCo-guided TTT study","subtitle":"Separate collection, query groups and preregistered decision status","chapter":"H8","notes":"The H8 experiment uses the MTEB HotpotQA-HardNegatives collection with 225,621 documents and 1,000 queries. The recorded arms include dense TTT, coverage TTT, MMR, k-centre, D-optimal, random and shuffled-teacher controls. Coverage TTT records pooled nDCG@10 of 0.7496 compared with 0.7346 for dense TTT. The preregistered DEV400 difference is plus 0.0103, but its interval includes zero, so the registered decision gate was not passed. The later 600-query group is post-decision exploratory evidence.","source":"","bullets":["225,621 documents · 1,000 queries","DEV400: +0.0103 [−0.0041, +0.0251]","Later 600: +0.0181 [+0.0062, +0.0303]"],"image":"assets/h8-results.png","image_caption":"H8 recorded nDCG@10"},{"n":24,"title":"Intermediate diagnostics and a separate coverage-only study","subtitle":"Coverage changes the feedback slate, but that does not establish a better residual","chapter":"Diagnostics","notes":"On FiQA, coverage selects documents at a much deeper mean dense rank than the dense top-ten arm, and its feedback-set judged recall is lower. The teacher target also has lower effective support. A separate HotpotQA diagnostic selected two supporting paragraphs from ten supplied paragraphs without reranking or TTT: dense top-two found both supports in 124 of 400 cases, while unnormalised DISCo-style coverage did so in 194 of 400. This is a different task and metric; it must not be merged with the TTT retrieval results.","source":"","bullets":["FiQA feedback recall: dense 0.5403 vs coverage 0.3977","Mean selected rank: 5.50 vs 19.73","Standalone diagnostic: 31.0% vs 48.5% · no TTT"],"image":"assets/h8-paired-ci.png","image_caption":"H8 paired differences · split-aware"},{"n":25,"title":"Scope of the evidence and the next measurements","subtitle":"Completed runs, separate historical studies and future tests remain distinct","chapter":"Close","notes":"The completed evidence includes FiQA-200 and HotpotQA-HN H8 DISCo-inspired feedback selection with query-wise TTT-Embed. Separate project studies include task-wise FiQA cross-fitting, SCIDOCS ReFIT, SciFact frozen-cache comparisons and an earlier ANN pilot. The current evidence does not establish that an original DISCo index would outperform dense candidate generation, nor does it settle which query properties predict useful complementary feedback. The next useful analysis is a paired, query-level examination of reranker scores on dense and coverage slates, followed by a separately approved first-stage complementary-retrieval experiment.","source":"","bullets":["No final research conclusion supplied","Reranker agreement analysis: archival analysis proposed","True first-stage complementary retrieval: future experiment"]},{"n":26,"title":"Appendix · Method identity and terminology","subtitle":"What was borrowed, what was implemented, and what was not","chapter":"Appendix","notes":"The original DISCo method uses a specialized contextual-token retrieval and indexing pipeline. Our implementation borrows its collective coverage objective inside a Qwen dense top-fifty pool, using frozen BERT-base-uncased token features. The reranker and TTT-Embed are separate downstream components added by our project. This appendix records the terminology needed to avoid claiming a full DISCo reproduction.","source":"","bullets":["DISCo paper: set-level coverage","Our selector: fixed-pool coverage","Qwen retriever and reranker remain distinct"]},{"n":27,"title":"Appendix · Additional FiQA diagnostics","subtitle":"Feedback-set composition and residual statistics","chapter":"Appendix","notes":"The diagnostic table shows how the feedback slate differs before optimisation. Coverage's selected documents come from deeper initial dense ranks on average and contain fewer judged positives according to the qrels. The teacher distribution is also more concentrated by the effective-support measure. These values describe the inputs and fitted vectors; they do not by themselves identify a causal explanation for the aggregate retrieval difference.","source":"","bullets":["Dense vs coverage feedback recall: 0.540268 vs 0.397735","Mean selected rank: 5.50 vs 19.73","Effective support: 3.957 vs 2.893"]},{"n":28,"title":"Appendix · Other project experiments","subtitle":"Keep distinct datasets, scopes and metrics separate","chapter":"Appendix","notes":"The project also contains a FiQA task-wise cross-fit over all 648 queries, where a shared task residual is fitted on training folds and evaluated on held-out queries. It records nDCG@10 of 0.46722 for raw retrieval and 0.46313 for the shared residual. The SCIDOCS ReFIT experiment covers 1,000 queries and reports Recall@100 of 37.8067% for raw Contriever, 38.3450% for direct reranking and 37.8717% for ReFIT. These are separate experiments, not additional DISCo-TTT arms.","source":"","bullets":["FiQA task-wise cross-fit: 648 queries; 0.46722 vs 0.46313","SCIDOCS ReFIT: 1,000 queries; Recall@100 37.8717%","Different methods, datasets and protocols"]},{"n":29,"title":"Appendix · H8 controls and paired comparisons","subtitle":"The split and the decision rule matter","chapter":"Appendix","notes":"H8 compares several selection policies with the same general teacher-feedback budget. The development set was the preregistered decision set. Its coverage-minus-dense TTT confidence interval includes zero. The later 600-query group was evaluated after the decision, and its interval is positive. The pooled result is descriptive. We preserve all three rather than presenting the pooled value as if it were a preregistered success.","source":"","bullets":["DEV400 +0.0103 [−0.0041,+0.0251]","Post-decision 600 +0.0181 [+0.0062,+0.0303]","Pooled 1,000 +0.0150 [+0.0057,+0.0245]"]},{"n":30,"title":"Appendix · References and reproducibility","subtitle":"Primary papers and local experiment records","chapter":"Appendix","notes":"The method lineage is grounded in the TOuR, ReFIT, TTT-Embed and DISCo papers. The local experiment records identify the FiQA and H8 runs, the selection and fitting implementations, and the separate diagnostics. Published method descriptions are not treated as evidence that our implementation reproduced every component of the original paper systems.","source":"","bullets":["TOuR · Findings of ACL 2023","ReFIT · arXiv:2305.11744","TTT-Embed · arXiv:2608.12569","DISCo · ICLR 2026","Local FiQA-200 and H8 experiment records"]}]</script><script id="leadset" type="application/json">{"1":"Black-box reranker feedback. Frozen models. Adaptable retrieval.","2":"At inference time, we may have scores and vectors but not training access.","3":"A reranker can reorder only the documents that the retriever found.","4":"The query-as-a-vector has been adapted using evidence since classical relevance feedback.","5":"Work with the interfaces a deployed retrieval service already exposes.","6":"Use cross-encoder feedback to move one test-time query vector; then retrieve again.","7":"Hard pseudo-labels discard score gradations. Soft feedback retains relative preferences.","8":"Cache expensive teacher scores once. Reuse them for repeated query-vector updates.","9":"The three methods are related, but they optimise and reuse feedback differently.","10":"TTT-Embed learns an external vector, not a new model checkpoint.","11":"The residual changes the similarity of the query to every stored document.","12":"Softmax and separate temperatures translate different score scales into preferences.","13":"Minimising teacher-to-student KL adjusts only the external query-space residual.","14":"The same residual formulation can be fitted per query, per task or globally.","15":"Complementarity can mean reduced redundancy, lexical recall or multi-aspect coverage.","16":"Independent document relevance is not collective coverage of all query tokens.","17":"DISCo selects the next document for what it adds to the selected set.","18":"Selection changes the vector directions and score contrasts available to TTT-Embed.","19":"Our completed tests vary feedback selection inside dense top 50, not the original DISCo first-stage index.","20":"FiQA: 200 queries, 57,638 documents, ten reranker feedback pairs per method.","21":"The standard dense-feedback TTT baseline and the DISCo-inspired feedback arm are compared on the same queries.","22":"The same method can promote a judged passage on one query and demote one on another.","23":"HotpotQA-HN: the preregistered 400-query decision and later exploratory 600 are separate.","24":"Feedback-set statistics and standalone supporting-evidence coverage answer different questions.","25":"The work documents completed measurements and explicitly separates the unrun first-stage retrieval hypothesis.","26":"The original DISCo retrieval index was not reproduced in the completed combined experiment.","27":"FiQA diagnostic inputs help distinguish feedback quality, initial rank and residual magnitude.","28":"Task-wise FiQA and SCIDOCS ReFIT are different methods and protocols, not extra DISCo arms.","29":"The H8 development decision failed its preregistered gate; later groups are exploratory.","30":"Published method papers and local executed run records are separate sources of evidence."}</script><script>

function bars(data,max=0.53,base=0.42){let out='';const col=['#BBC3D5','#1E3AF5','#8496C5','#BFC8D9','#D6DAE5','#99A4BE','#CFD4DD'];out+=txt(10,28,'nDCG@10  ·  FiQA-200  ·  full-corpus retrieval','chartHead');data.forEach((d,i)=>{let y=70+i*46;let w=320*(d[1]-base)/(max-base);out+=txt(0,y+16,d[0],'chartLabel')+rect(236,y,320,26,'#F0F2F7')+rect(236,y,Math.max(2,w),26,col[i],undefined,2)+txt(567,y+17,d[1].toFixed(4),'chartValue');});out+=txt(235,416,'0.42','chartTiny')+txt(555,416,'0.53','chartTiny','end');return svg(out,'0 0 640 440')}

function cis(data){let out=txt(20,30,'Paired Δ nDCG@10 · descriptive 95% intervals','chartHead');out+=rect(350,50,1,300,'#8190A8');const min=-.05,max=.04,x=v=>180+(v-min)/(max-min)*370;out+=rect(x(0),50,2,280,'#52617E');data.forEach((d,i)=>{const y=102+i*110;out+=txt(18,y-20,d[0]);out+=`<line x1="${x(d[2])}" y1="${y}" x2="${x(d[3])}" y2="${y}" stroke="#1E3AF5" stroke-width="5"/>`+`<circle cx="${x(d[1])}" cy="${y}" r="7" fill="#1E3AF5"/>`+txt(18,y+28,`Mean ${d[1]>=0?'+':''}${d[1].toFixed(4)} [${d[2].toFixed(4)}, ${d[3].toFixed(4)}]`,'chartTiny');});return svg(out,'0 0 620 330')}
function temp(){const scores=[.91,.74,.42,.12];function sm(t){const a=scores.map(x=>Math.exp((x-.91)/t));const s=a.reduce((a,b)=>a+b);return a.map(x=>x/s)};let o=txt(16,28,'Same teacher scores · different temperatures','chartHead');[.5,.2,.02].forEach((t,k)=>{const colors=['#C0C7D6','#8497C8','#1E3AF5'];const v=sm(t), x0=175+k*135;o+=txt(x0+48,70,'τ = '+t,'chartLabel','middle');v.forEach((p,i)=>{const y=95+i*67;o+=txt(x0-28,y+18,'d'+(i+1),'chartTiny')+rect(x0,y,96,22,'#EFF1F7')+rect(x0,y,Math.max(1,p*96),22,colors[k])+txt(x0+100,y+17,p.toFixed(2),'chartTiny')})});o+=txt(16,400,'Illustrative probabilities. No actual model scores are being graphed.','chartTiny');return svg(o,'0 0 620 428')}

function coverage(){let o=txt(12,27,'Marginal coverage rewards a missing aspect','chartHead');['A · entity','B · relation','C · second hop'].forEach((v,i)=>{o+=rect(20,70+i*75,145,48,'#EBEEFF','#C6CEFF',10)+txt(32,99+i*75,v,'chartLabel')});[['Dense 1','A + B'],['Dense 2','A'],['Coverage 3','C']].forEach((v,i)=>{let y=70+i*75;o+=rect(255,y,310,49,i===2?'#E4ECFF':'#F3F5F9','#C6CEFF',6)+txt(269,y+20,v[0],'chartHead')+txt(408,y+20,v[1],'chartLabel')+txt(270,y+38,i===2?'Adds uncovered query aspect':'Overlaps coverage already provided','chartTiny')});o+=txt(30,387,'Constructed example: coverage does not imply relevance.','chartTiny');return svg(o)}

case 15:return table(['Mechanism','What it adds'],[['MMR','Penalises redundancy among selected candidates'],['BM25 + dense','Recovers lexical evidence outside semantic matching'],['Reciprocal rank fusion','Combines rankings from different retrievers'],['Collective token coverage','Selects passages for missing query aspects']]);
case 16:return `<div class="cards">${card('ColBERT-style relevance','Sum of each query token’s best match inside ONE document.')}${card('DISCo coverage','Each query token’s best match across the UNION of selected documents.')}${card('Set matters','The value of a new passage depends on what previous passages cover.')}${card('Not guaranteed','A different aspect may be irrelevant or have poor alignment in Qwen space.')}</div>`;

case 21:return bars([['Raw dense',.461751],['Dense top-10 TTT',.505956],['Coverage TTT',.480703],['MMR TTT',.504594],['Hybrid TTT',.500191],['BERT MaxSim TTT',.488074],['BM25 TTT',.462804]]);

const links={6:'https://aclanthology.org/2023.findings-acl.354/',7:'https://aclanthology.org/2023.findings-acl.354/',8:'https://arxiv.org/abs/2305.11744',10:'https://arxiv.org/abs/2608.12569',14:'https://arxiv.org/abs/2608.12569',16:'https://openreview.net/forum?id=cUdODCFjUM',17:'https://openreview.net/forum?id=cUdODCFjUM'};
function content(s){const left=s.n===1?'':`<div class="left"><p class="lead">${e(leads[s.n])}</p><div class="points">${s.bullets.slice(0,3).map(t=>`<div class="point">${e(t)}</div>`).join('')}</div></div>`;return `<section class="slide ${s.n===1?'cover':(s.title.length>80?'longtitle':'')}"><div class="s-top"><span>${s.chapter.toUpperCase()} · CEOUS</span><span class="s-page">${String(s.n).padStart(2,'0')} / ${slides.length}</span></div><h1 class="s-title ${s.title.length>73?'small':''}">${e(s.title)}</h1><p class="s-sub">${e(s.subtitle)}</p><div class="bodygrid">${left}<div class="graphic">${visuals(s)}</div></div><div class="s-bottom"><span>${s.n<=25?'MAIN PRESENTATION':'TECHNICAL APPENDIX'} · IIIT HYDERABAD</span><span class="source">${links[s.n]?`<a href="${links[s.n]}" target="_blank" rel="noopener" style="color:var(--blue)">PRIMARY PAPER ↗</a>`:'CEOUS · EXPERIMENT RECORDS'}</span></div></section>`}
function fit(){const v=$('#viewport');if(!v)return;const stage=$('#stage');const scale=Math.min((stage.clientWidth-20)/1280,(stage.clientHeight-16)/720);v.style.transform=`scale(${Math.min(1.1,scale)})`;}
function render(){const s=slides[n];$('#viewport').innerHTML=content(s);$('#current').textContent=String(n+1).padStart(2,'0');$('#all').textContent=slides.length;$('#progress').style.width=((n+1)/slides.length*100)+'%';$('#noteText').value=storage.getItem('ire-v3-note-'+s.n)||s.notes;$('#reviewText').value=storage.getItem('ire-v3-review-'+s.n)||'';$('#reviewState').value=storage.getItem('ire-v3-state-'+s.n)||'unreviewed';$('#slideId').textContent='Slide '+s.n+': '+s.title;try{history.replaceState({},'','?s='+s.n)}catch(e){}fit()}
function go(i){n=Math.max(0,Math.min(slides.length-1,i));render()}
$('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);$('#outlineBtn').onclick=()=>{$('#outline').classList.toggle('open')};$('#closeOutline').onclick=()=>{$('#outline').classList.remove('open')};$('#notesBtn').onclick=()=>{$('#notesPanel').classList.toggle('open')};$('#closeNotes').onclick=()=>{$('#notesPanel').classList.remove('open')};$('#copyNotes').onclick=()=>{navigator.clipboard?.writeText($('#noteText').value)};$('#noteText').oninput=()=>storage.setItem('ire-v3-note-'+slides[n].n,$('#noteText').value);
$('#reviewText').oninput=()=>storage.setItem('ire-v3-review-'+slides[n].n,$('#reviewText').value);$('#reviewState').onchange=()=>storage.setItem('ire-v3-state-'+slides[n].n,$('#reviewState').value);$('#copyReview').onclick=()=>{let t=slides.map(s=>{let text=storage.getItem('ire-v3-review-'+s.n)||'';let st=storage.getItem('ire-v3-state-'+s.n)||'unreviewed';return (text||st!=='unreviewed')?`Slide ${s.n}: ${st}\n${text}`:''}).filter(Boolean).join('\n\n');navigator.clipboard?.writeText(t||'No feedback entered.');};
$('#printBtn').onclick=()=>{if(!$('#printDeck').innerHTML)$('#printDeck').innerHTML=slides.map(s=>`<div class="printPage">${content(s)}</div>`).join('');window.print()};$('#fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
$('#overviewGrid').innerHTML=slides.map((s,i)=>`<button class="overviewTile" data-i="${i}"><b>${String(s.n).padStart(2,'0')} · ${s.chapter}</b>${e(s.title)}</button>`).join('');$('#overviewGrid').onclick=ev=>{let b=ev.target.closest('[data-i]');if(b){$('#outline').classList.remove('open');go(Number(b.dataset.i))}};
document.addEventListener('keydown',ev=>{if(ev.target.closest('textarea,input,select'))return;if(['ArrowRight','PageDown',' '].includes(ev.key)){ev.preventDefault();go(n+1)}if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();go(n-1)}if(ev.key==='Home'){go(0)}if(ev.key==='End'){go(slides.length-1)}if(ev.key==='Escape'){$('#notesPanel').classList.remove('open');$('#outline').classList.remove('open')}});
window.addEventListener('resize',fit);render();
